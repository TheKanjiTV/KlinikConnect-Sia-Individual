services:
  app:
    build:
      context: ./klinik-laravel-api
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./klinik-laravel-api:/var/www/html
      - laravel_vendor:/var/www/html/vendor
      - laravel_storage:/var/www/html/storage
    environment:
      APP_NAME: KlinikConnect
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: klinik
      DB_USERNAME: klinik
      DB_PASSWORD: ${DB_PASSWORD:-klinik_local}
      SESSION_DRIVER: file
      SESSION_DOMAIN: localhost
      SESSION_SECURE_COOKIE: "false"
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173,localhost:8000,127.0.0.1:8000
      FILESYSTEM_DISK: public
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        composer install --no-interaction --prefer-dist &&
        if [ ! -f .env ]; then cp .env.example .env; fi &&
        if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force --no-interaction; fi &&
        php artisan storage:link &&
        php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: klinik
      MYSQL_USER: klinik
      MYSQL_PASSWORD: ${DB_PASSWORD:-klinik_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-klinik_root_local}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./klinik-vuejs:/app
      - vue_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
      VITE_API_ORIGIN: ""
      VITE_REVERB_HOST: localhost
    ports:
      - "5173:5173"
    depends_on:
      - app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  mysql_data:
  laravel_vendor:
  laravel_storage:
  vue_node_modules:
